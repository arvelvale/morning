<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morning 原型 · 方向③ 微光仪式 · 昼夜双主题</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html,body { min-height:100%; }
  body { font-family: "Noto Serif SC", "Cormorant Garamond", serif; }
  .stage { min-height:100vh; padding:52px 40px 90px; transition:background .6s ease; }
  .page-head { text-align:center; max-width:900px; margin:0 auto 30px; }
  .page-head .kicker { font-size:13px; letter-spacing:.4em; text-transform:uppercase; }
  .page-head h1 { font-family:"Cormorant Garamond","Noto Serif SC",serif; font-weight:500; font-size:44px; margin:14px 0 12px; letter-spacing:.02em; }
  .page-head p { font-size:15px; line-height:1.85; max-width:660px; margin:0 auto; }
  .themebar { display:flex; justify-content:center; margin:0 auto 46px; }
  .rack { display:flex; flex-wrap:wrap; gap:44px 32px; justify-content:center; align-items:flex-start; max-width:1500px; margin:0 auto; }
  .cell { display:flex; flex-direction:column; align-items:center; }
  .cell .cap { font-style:italic; font-family:"Cormorant Garamond",serif; font-size:15px; margin-bottom:16px; letter-spacing:.02em; }
  .cell .cap b { font-style:normal; font-weight:600; margin-right:7px; }
  @keyframes wave3 { 0%,100%{transform:scaleY(.3);opacity:.5} 50%{transform:scaleY(1);opacity:1} }
  @keyframes floatIn3 { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  @keyframes breathe3 { 0%,100%{opacity:.5;transform:scale(1)} 50%{opacity:.95;transform:scale(1.06)} }
  @keyframes flare { 0%,100%{opacity:.7} 50%{opacity:1} }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;
const serif='"Cormorant Garamond","Noto Serif SC",serif';
const song='"Noto Serif SC",serif';

/* ============ 昼 / 夜 双主题：同一套排版，只换配色 ============ */
const THEMES = {
  night: {
    key:'night', label:'夜',
    rgb:'240,168,104', accent:'#F0A868', accent2:'#E8894B', onAccent:'#2a1608',
    text:'#EDE6DA', sub:'#8f8474', faint:'#5f574c',
    stageBg:'radial-gradient(1100px 800px at 50% -8%, #1c1512, #0a0807 62%, #050403)',
    screenBg:'radial-gradient(120% 80% at 50% 0%, #171310, #0b0908 65%, #070605)',
    theaterBg:'#050403',
    card:{ background:'rgba(255,255,255,.035)', border:'1px solid rgba(240,168,104,.14)', borderRadius:16, backdropFilter:'blur(2px)' },
    divider:'1px solid rgba(255,255,255,.06)',
    frameWrap:{ background:'#161210', boxShadow:'0 0 0 1.5px #2a231d, 0 30px 70px rgba(0,0,0,.7), 0 0 60px rgba(240,168,104,.06)' },
    homeBg:'rgba(237,230,218,.4)',
    softBg:'rgba(255,255,255,.06)', previewBase:'#0a0706', glow:true,
  },
  day: {
    key:'day', label:'昼',
    rgb:'176,71,47', accent:'#B0472F', accent2:'#8F3A24', onAccent:'#FBF6E7',
    text:'#2E2A22', sub:'#7c7261', faint:'#a99a82',
    stageBg:'radial-gradient(1000px 700px at 50% -5%, #ece2c8, #d8cbac 70%)',
    screenBg:'linear-gradient(180deg,#F6EEDB,#EFE5CE)',
    theaterBg:'linear-gradient(180deg,#F1E7CF,#E8DCC0)',
    card:{ background:'#FBF6E7', border:'1px solid #DCCFB0', borderRadius:16, boxShadow:'0 1px 0 #fff inset, 0 6px 16px rgba(120,100,60,.1)' },
    divider:'1px dashed #d8ccae',
    frameWrap:{ background:'#3a3226', boxShadow:'0 0 0 2px #4a4030, 0 30px 60px rgba(80,60,30,.35)' },
    homeBg:'rgba(46,42,34,.35)',
    softBg:'rgba(176,71,47,.08)', previewBase:'#c9b78f', glow:false,
  },
};
const rgba=(t,a)=>`rgba(${t.rgb},${a})`;
const glowSh=(t,css)=> t.glow?css:'none';

const pad={ padding:'72px 26px 32px' };

/* iOS 外壳 */
function Phone({children,t,bg,time='23:47'}) {
  const F={
    wrapper:{display:'inline-block',padding:11,borderRadius:58,...t.frameWrap},
    screen:{position:'relative',borderRadius:47,overflow:'hidden',width:372,height:806,background:bg},
    statusBar:{position:'absolute',top:0,left:0,right:0,height:54,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 32px',fontSize:16,fontWeight:500,zIndex:20,pointerEvents:'none',color:t.text},
    island:{position:'absolute',top:12,left:'50%',transform:'translateX(-50%)',width:120,height:35,background:t.key==='night'?'#000':'#1a1206',borderRadius:999,zIndex:30},
    content:{position:'absolute',top:54,left:0,right:0,bottom:0,overflow:'hidden'},
    home:{position:'absolute',bottom:9,left:'50%',transform:'translateX(-50%)',width:130,height:5,background:t.homeBg,borderRadius:999,zIndex:25},
  };
  return <div style={F.wrapper}><div style={F.screen}>
    <div style={F.statusBar}>
      <span>{time}</span>
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        <div style={{display:'flex',alignItems:'flex-end',gap:2,height:11}}>{[4,6,8,10].map((h,i)=><div key={i} style={{width:3,height:h,background:'currentColor',borderRadius:1}}/>)}</div>
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"/><path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round"/><path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity=".6"/></svg>
        <div style={{width:25,height:12,border:'1.4px solid currentColor',borderRadius:3,padding:1,opacity:.85,position:'relative'}}><div style={{width:'82%',height:'100%',background:'currentColor',borderRadius:1}}/><div style={{position:'absolute',top:3,right:-3,width:2,height:6,background:'currentColor',borderRadius:'0 1px 1px 0'}}/></div>
      </div>
    </div>
    <div style={F.island}/><div style={F.content}>{children}</div><div style={F.home}/>
  </div></div>;
}

/* 屏1 倾倒 */
function DumpScreen({t}){
  const [on,setOn]=useState(false);
  return <div style={{...pad,height:'100%',display:'flex',flexDirection:'column',position:'relative'}}>
    <div style={{position:'absolute',top:0,left:0,right:0,height:'100%',background:`radial-gradient(60% 34% at 50% 62%, ${rgba(t,on?.16:.08)}, transparent 70%)`,pointerEvents:'none',transition:'1s'}}/>
    <div style={{fontSize:12.5,letterSpacing:'.28em',color:t.accent,zIndex:1}}>今夜 · 最后一件事</div>
    <h2 style={{fontFamily:serif,fontWeight:500,fontSize:33,lineHeight:1.32,marginTop:16,zIndex:1,color:t.text}}>说给夜听。<br/>其余的，交出去。</h2>
    <p style={{fontSize:14.5,color:t.sub,marginTop:14,lineHeight:1.85,zIndex:1}}>{on?'在听。慢慢说，不用有条理。':'今晚放不下的，一件件说出来。'}</p>
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:30,zIndex:1}}>
      <button onClick={()=>setOn(v=>!v)} style={{width:132,height:132,borderRadius:'50%',border:'none',cursor:'pointer',background:`radial-gradient(circle at 50% 42%, ${t.accent}, ${t.accent2} 62%, ${t.key==='night'?'#7a4322':'#5e2415'})`,boxShadow: on?glowSh(t,`0 0 60px ${rgba(t,.6)},0 0 120px ${rgba(t,.3)}`):glowSh(t,`0 0 34px ${rgba(t,.28)}`),position:'relative',transition:'.5s',animation: on?'none':'breathe3 3.4s ease-in-out infinite',display:'grid',placeItems:'center'}}>
        {on
          ? <div style={{display:'flex',alignItems:'center',gap:4,height:34}}>{[0,1,2,3,4].map(i=><div key={i} style={{width:4,height:30,background:t.onAccent,borderRadius:2,animation:`wave3 1s ${i*.13}s ease-in-out infinite`}}/>)}</div>
          : <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke={t.onAccent} strokeWidth="1.8"><path d="M12 2a3 3 0 013 3v6a3 3 0 01-6 0V5a3 3 0 013-3z"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>}
      </button>
      <div style={{fontFamily:serif,fontStyle:'italic',fontSize:17,color: on?t.accent:t.sub,transition:'.4s'}}>{on?'倾倒中…':'按住，开始'}</div>
    </div>
    <div style={{...t.card,padding:'14px 16px',display:'flex',alignItems:'center',gap:10,zIndex:1}}>
      <span style={{color:t.faint,fontFamily:serif,fontStyle:'italic',fontSize:15}}>Aa</span>
      <span style={{fontSize:14,color:t.faint}}>或者，安静地打字…</span>
    </div>
  </div>;
}

/* 屏2 回执 — 一束光打在保管箱 */
function ReceiptScreen({t}){
  const embers=[['2 件','明早交还给你'],['1 个灵感','已封存'],['1 件','已生成下一步'],['2 件','无需再想']];
  return <div style={{height:'100%',display:'flex',flexDirection:'column',position:'relative',background:`radial-gradient(80% 46% at 50% 30%, ${rgba(t,t.glow?.14:.1)}, transparent 66%)`}}>
    <div style={{...pad,paddingBottom:0}}>
      <div style={{fontSize:12.5,letterSpacing:'.28em',color:t.accent,textAlign:'center'}}>妥了</div>
      <h2 style={{fontFamily:serif,fontWeight:500,fontSize:27,marginTop:10,textAlign:'center',color:t.text}}>6 件，都收进保管箱了</h2>
    </div>
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',position:'relative'}}>
      <div style={{position:'absolute',top:'6%',left:'50%',transform:'translateX(-50%)',width:2,height:'42%',background:`linear-gradient(180deg, ${rgba(t,.5)}, transparent)`}}/>
      <div style={{position:'relative',animation:'flare 4s ease-in-out infinite'}}>
        <div style={{position:'absolute',inset:-46,borderRadius:'50%',background:`radial-gradient(circle, ${rgba(t,t.glow?.35:.18)}, transparent 70%)`}}/>
        <svg width="112" height="112" viewBox="0 0 48 48" fill="none" stroke={t.accent} strokeWidth="1.4" style={{position:'relative'}}>
          <rect x="8" y="16" width="32" height="24" rx="3"/>
          <path d="M8 24h32" opacity=".6"/>
          <rect x="20" y="20" width="8" height="7" rx="1.5" fill={t.accent} stroke="none" opacity=".9"/>
          <path d="M14 16l4-6h12l4 6" opacity=".7"/>
        </svg>
      </div>
      <div style={{marginTop:22,display:'flex',flexDirection:'column',gap:9,width:250}}>
        {embers.map(([n,tx],i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:11,animation:`floatIn3 .6s ${.2+i*.12}s both`,opacity:i>1?.5:1}}>
            <span style={{width:7,height:7,borderRadius:'50%',background:t.accent,boxShadow:i>1?'none':glowSh(t,`0 0 8px ${t.accent}`),opacity:i>1?.4:1,flexShrink:0}}/>
            <span style={{fontFamily:serif,fontSize:16,color:t.accent,minWidth:46}}>{n}</span>
            <span style={{fontSize:13.5,color:t.sub}}>{tx}</span>
          </div>
        ))}
      </div>
    </div>
    <div style={{padding:'0 26px 26px',textAlign:'center'}}>
      <p style={{fontFamily:serif,fontStyle:'italic',fontSize:16.5,color:t.text,lineHeight:1.75,marginBottom:14}}>灯我替你留着。<br/>你可以关机了。</p>
      <div style={{fontSize:12.5,color:t.faint,letterSpacing:'.14em'}}>↓ 熄灯 · 睡吧</div>
    </div>
  </div>;
}

/* 屏3 归还 */
function ReturnScreen({t}){
  const [done,setDone]=useState({});
  const items=[['交材料','昨晚你说 10 点前要交',['加入日历','复制到项目']],['给妈打个电话','来自那晚的重演结算',['加入待办','暂缓一天']],['修那个报错','代码里还留着',['加入待办','确认已处理']]];
  return <div style={{...pad,height:'100%',overflow:'auto'}}>
    <div style={{fontSize:12.5,letterSpacing:'.28em',color:t.accent}}>明早见 · 6:30</div>
    <h2 style={{fontFamily:serif,fontWeight:500,fontSize:25,marginTop:12,lineHeight:1.45,color:t.text}}>昨晚收了 6 件，<br/>只把该做的 3 件交还你。</h2>
    <div style={{marginTop:18,display:'flex',flexDirection:'column',gap:12}}>
      {items.map(([tx,s,acts],i)=>(
        <div key={i} style={{...t.card,padding:'15px 16px',position:'relative',opacity:done[i]?.45:1,transition:'.4s'}}>
          <div style={{position:'absolute',top:15,right:15}}>{done[i]?<span style={{color:t.faint,fontSize:12}}>✓ 已熄</span>:<span style={{width:8,height:8,borderRadius:'50%',background:t.accent,boxShadow:glowSh(t,`0 0 8px ${t.accent}`),display:'inline-block'}}/>}</div>
          <div style={{fontSize:16,fontWeight:500,textDecoration:done[i]?'line-through':'none',color:done[i]?t.sub:t.text}}>{tx}</div>
          <div style={{fontSize:12.5,color:t.sub,marginTop:4}}>{s}</div>
          <div style={{display:'flex',gap:8,marginTop:13,flexWrap:'wrap'}}>
            {acts.map(a=><button key={a} onClick={()=>setDone(d=>({...d,[i]:true}))} style={{fontSize:12.5,padding:'7px 13px',borderRadius:9,cursor:'pointer',border:`1px solid ${rgba(t,.35)}`,background:rgba(t,.06),color:t.accent}}>{a}</button>)}
          </div>
        </div>
      ))}
    </div>
    <div style={{marginTop:20,paddingTop:15,borderTop:t.divider}}>
      <div style={{fontSize:12.5,color:t.sub,marginBottom:8}}>待补区 · 缺信息，先替你留着（不急）</div>
      {[['“下班前”回复客户','缺具体时间'],['寄给老陈的地址','缺地址']].map(([tx,s],i)=>(
        <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'9px 0'}}>
          <div><div style={{fontSize:14,color:t.text}}>{tx}</div><div style={{fontSize:11.5,color:t.accent,opacity:.9}}>{s}</div></div>
          <button style={{fontSize:12.5,padding:'6px 12px',borderRadius:9,border:`1px solid ${t.key==='night'?'rgba(255,255,255,.14)':'#d8ccae'}`,background:'transparent',color:t.sub,cursor:'pointer'}}>补全</button>
        </div>
      ))}
    </div>
  </div>;
}

/* 屏4 角色库 */
function CastScreen({t}){
  const people=[['妈妈','家人 · 12 段记忆','妈',false],['老陈','旧同事 · 未完成的告别','陈',false],['那个夏天的自己','过去的自己 · 特殊角色','我',true]];
  return <div style={{...pad,height:'100%',overflow:'auto'}}>
    <div style={{fontSize:12.5,letterSpacing:'.28em',color:t.accent}}>角色库 · 建角</div>
    <h2 style={{fontFamily:serif,fontWeight:500,fontSize:27,marginTop:12,color:t.text}}>你生命里的人</h2>
    <p style={{fontSize:13.5,color:t.sub,marginTop:8,lineHeight:1.75}}>写下他的性格、经历、和你的关系史。写得越准，重演时他就越像那个真实的他。</p>
    <div style={{marginTop:18,display:'flex',flexDirection:'column',gap:12}}>
      {people.map(([n,r,ini,sp],i)=>(
        <div key={i} style={{...t.card,padding:'15px',display:'flex',alignItems:'center',gap:14,...(sp?{borderColor:rgba(t,.4),background:rgba(t,.06)}:{})}}>
          <div style={{width:48,height:48,borderRadius:'50%',display:'grid',placeItems:'center',fontFamily:song,fontSize:16,color: sp?t.onAccent:t.text,flexShrink:0,background: sp?`radial-gradient(circle at 40% 35%, ${t.accent}, ${t.accent2})`:t.softBg,border:sp?'none':`1px solid ${rgba(t,.2)}`,boxShadow:sp?glowSh(t,`0 0 18px ${rgba(t,.4)}`):'none'}}>{ini}</div>
          <div style={{flex:1}}><div style={{fontSize:16,color:t.text}}>{n}</div><div style={{fontSize:12.5,color:sp?t.accent:t.sub,marginTop:3}}>{r}</div></div>
          <span style={{color:t.faint,fontSize:20}}>›</span>
        </div>
      ))}
    </div>
    <button style={{marginTop:16,width:'100%',padding:'15px',borderRadius:12,border:`1px dashed ${rgba(t,.4)}`,background:'transparent',color:t.accent,fontSize:14.5,cursor:'pointer',fontFamily:serif}}>+ 写下一个人</button>
  </div>;
}

/* 屏5 剧场 */
function TheaterScreen({t}){
  const [step,setStep]=useState(1);
  const next=()=>setStep(s=>Math.min(s+1,2));
  return <div style={{height:'100%',display:'flex',flexDirection:'column',background:t.theaterBg}}>
    <div style={{padding:'66px 24px 0'}}>
      <div style={{display:'flex',gap:6,marginBottom:14}}>{['校准','重演','结算'].map((l,i)=>(
        <div key={i} style={{flex:1,textAlign:'center'}}><div style={{height:2.5,borderRadius:2,background:i<=step?t.accent:(t.key==='night'?'rgba(255,255,255,.1)':'#d3c7a8'),boxShadow:i<=step?glowSh(t,`0 0 6px ${t.accent}`):'none'}}/><div style={{fontSize:11,marginTop:6,color:i<=step?t.accent:t.faint}}>{l}</div></div>
      ))}</div>
    </div>
    <div style={{flex:1,padding:'6px 24px',overflow:'auto'}}>
      {step===0 && (<>
        <div style={{fontFamily:serif,fontSize:20,marginBottom:6,color:t.text}}>校准 · 她会怎么说</div>
        <p style={{fontSize:13,color:t.sub,marginBottom:18,lineHeight:1.7}}>不对就改。每一次纠正，都是你在看清心里那个她。</p>
        <div style={{...t.card,padding:'14px 15px',marginBottom:12}}><div style={{fontSize:11,color:t.accent,marginBottom:5}}>妈妈</div><div style={{fontSize:14.5,lineHeight:1.7,fontFamily:song,color:t.text}}>“你怎么又这么晚，说过多少次了。”</div></div>
        <button onClick={next} style={{width:'100%',padding:'13px',borderRadius:10,border:`1px solid ${rgba(t,.4)}`,background:rgba(t,.06),color:t.accent,fontSize:14,cursor:'pointer'}}>不对，她不会这么说 →</button>
      </>)}
      {step===1 && (<>
        <div style={{fontFamily:serif,fontSize:20,marginBottom:12,color:t.text}}>重演 · 那个雨夜</div>
        <div style={{height:184,borderRadius:14,background:`radial-gradient(circle at 62% 40%, ${rgba(t,.22)}, ${t.previewBase} 70%)`,position:'relative',overflow:'hidden',marginBottom:14,border:`1px solid ${rgba(t,.12)}`}}>
          <div style={{position:'absolute',bottom:0,left:'50%',transform:'translateX(-50%)',width:56,height:120,background:`linear-gradient(180deg, ${rgba(t,.4)}, ${rgba(t,.04)})`,borderRadius:'30px 30px 0 0',filter:'blur(1px)'}}/>
          <div style={{position:'absolute',bottom:24,left:'50%',transform:'translateX(-50%)',width:22,height:22,borderRadius:'50%',background:t.accent,boxShadow:glowSh(t,`0 0 20px ${t.accent}`),opacity:.5}}/>
          <div style={{position:'absolute',top:12,left:14,fontSize:10.5,color:rgba(t,.75),letterSpacing:'.1em'}}>◆ 命中「客厅」· three.js 3D 重演</div>
        </div>
        <div style={{...t.card,padding:'14px 15px',marginBottom:12}}><div style={{fontSize:11,color:t.accent,marginBottom:5}}>妈妈</div><div style={{fontSize:14.5,lineHeight:1.7,fontFamily:song,color:t.text}}>“……饭在锅里，还热着。快去洗手吧。”</div></div>
        <button onClick={next} style={{width:'100%',padding:'13px',borderRadius:10,border:'none',background:`linear-gradient(90deg,${t.accent},${t.accent2})`,color:t.onAccent,fontSize:14,fontWeight:600,cursor:'pointer'}}>我有话想对她说 →</button>
      </>)}
      {step===2 && (<>
        <div style={{fontFamily:serif,fontSize:20,marginBottom:6,color:t.text}}>结算 · 带一件东西回来</div>
        <p style={{fontSize:13,color:t.sub,marginBottom:16,lineHeight:1.7}}>不必修好过去，只留一句能带回当下的话。</p>
        <div style={{...t.card,padding:'18px 16px',marginBottom:14,borderColor:rgba(t,.4),background:rgba(t,.05)}}>
          <div style={{fontSize:11,color:t.accent,letterSpacing:'.12em',marginBottom:10}}>一句终于说出口的话</div>
          <div style={{fontFamily:serif,fontSize:17,lineHeight:1.8,fontStyle:'italic',color:t.text}}>“妈，那天谢谢你留的那盏灯。<br/>我一直记得。”</div>
        </div>
        {['一句终于说出口的话','一封不寄出的信','明天能做的一个最小行动'].map((o,i)=>(
          <div key={i} style={{padding:'11px 0',fontSize:14,color:i===0?t.text:t.sub,display:'flex',gap:10}}><span style={{color:t.accent}}>{i===0?'●':'○'}</span>{o}</div>
        ))}
        <button style={{marginTop:14,width:'100%',padding:'14px',borderRadius:10,border:'none',background:`linear-gradient(90deg,${t.accent},${t.accent2})`,color:t.onAccent,fontSize:14,fontWeight:600,cursor:'pointer'}}>把「给妈打个电话」放进明早 ↩</button>
      </>)}
    </div>
  </div>;
}

/* 屏6 设置 */
function Toggle({t,on:init=false}){const [on,setOn]=useState(init);return <button onClick={()=>setOn(v=>!v)} style={{width:46,height:27,borderRadius:999,border:'none',cursor:'pointer',background:on?t.accent:(t.key==='night'?'rgba(255,255,255,.14)':'#cbbd9c'),position:'relative',transition:'.25s',flexShrink:0,boxShadow:on?glowSh(t,`0 0 12px ${rgba(t,.5)}`):'none'}}><span style={{position:'absolute',top:3,left:on?22:3,width:21,height:21,borderRadius:'50%',background:on?t.onAccent:'#EDE6DA',transition:'.25s'}}/></button>;}
function SettingsScreen({t,theme,setTheme}){
  const groups=[['隐私 · 你说的只属于你',[['保留原始倾诉','关掉后只留整理结果，原话即焚',false],['仅在本机识别','敏感内容不出设备',true],['阅后即焚','看过的历史自动熄灭',true]]],['提醒',[['到点主动提醒','带时间的事，agent 到点唤你',true],['睡前轻唤','每晚 22:00，一次轻提醒',true]]]];
  return <div style={{...pad,height:'100%',overflow:'auto'}}>
    <div style={{fontSize:12.5,letterSpacing:'.28em',color:t.accent}}>设置</div>
    <h2 style={{fontFamily:serif,fontWeight:500,fontSize:27,marginTop:12,color:t.text}}>只留一处光</h2>
    {/* 主题：昼 / 夜 手动切换 */}
    <div style={{marginTop:22}}>
      <div style={{fontSize:12,color:t.sub,letterSpacing:'.04em',marginBottom:10}}>外观 · 昼夜</div>
      <div style={{...t.card,padding:'6px',display:'flex',gap:6}}>
        {[['day','昼 · 暖纸'],['night','夜 · 微光']].map(([k,l])=>(
          <button key={k} onClick={()=>setTheme(k)} style={{flex:1,padding:'12px 0',borderRadius:11,border:'none',cursor:'pointer',fontFamily:serif,fontSize:14.5,transition:'.25s',
            background: theme===k?`linear-gradient(90deg,${t.accent},${t.accent2})`:'transparent',
            color: theme===k?t.onAccent:t.sub,
            boxShadow: theme===k?glowSh(t,`0 0 14px ${rgba(t,.4)}`):'none'}}>{l}</button>
        ))}
      </div>
    </div>
    {groups.map(([title,rows],gi)=>(
      <div key={gi} style={{marginTop:22}}>
        <div style={{fontSize:12,color:t.sub,letterSpacing:'.04em',marginBottom:10}}>{title}</div>
        <div style={{...t.card,overflow:'hidden',padding:0}}>
          {rows.map(([tx,s,on],ri)=>(
            <div key={ri} style={{display:'flex',alignItems:'center',gap:12,padding:'15px 16px',borderTop:ri?t.divider:'none'}}>
              <div style={{flex:1}}><div style={{fontSize:14.5,color:t.text}}>{tx}</div><div style={{fontSize:12,color:t.sub,marginTop:2}}>{s}</div></div><Toggle t={t} on={on}/>
            </div>
          ))}
        </div>
      </div>
    ))}
    <p style={{fontSize:12.5,color:t.faint,textAlign:'center',marginTop:26,lineHeight:1.85,fontStyle:'italic',fontFamily:serif}}>Morning 从不承诺治疗，<br/>只帮你的大脑，安心下班。</p>
  </div>;
}

/* 顶部昼夜大开关 */
function ThemeSwitch({theme,setTheme,t}){
  return <div style={{display:'inline-flex',padding:5,borderRadius:999,background:t.key==='night'?'rgba(255,255,255,.05)':'rgba(255,255,255,.5)',border:`1px solid ${rgba(t,.25)}`,gap:4}}>
    {[['day','☀︎ 昼 · 暖纸'],['night','☾ 夜 · 微光']].map(([k,l])=>(
      <button key={k} onClick={()=>setTheme(k)} style={{padding:'9px 20px',borderRadius:999,border:'none',cursor:'pointer',fontFamily:serif,fontSize:15,letterSpacing:'.02em',transition:'.25s',
        background: theme===k?`linear-gradient(90deg,${t.accent},${t.accent2})`:'transparent',
        color: theme===k?t.onAccent:t.sub,
        boxShadow: theme===k?glowSh(t,`0 0 16px ${rgba(t,.4)}`):'none'}}>{l}</button>
    ))}
  </div>;
}

function App(){
  const [theme,setTheme]=useState(location.hash==='#day'?'day':'night');
  const t=THEMES[theme];
  const screens=[
    ['01','倾倒入口 · 睡前最后一屏',<DumpScreen t={t}/>,t.screenBg,'23:47'],
    ['02','托管回执「妥了」· 一束光',<ReceiptScreen t={t}/>,t.screenBg,'23:49'],
    ['03','次日归还「明早见」',<ReturnScreen t={t}/>,t.screenBg,'6:30'],
    ['04','角色库 · 建角',<CastScreen t={t}/>,t.screenBg,'22:10'],
    ['05','剧场「那晚」· 校准→重演→结算',<TheaterScreen t={t}/>,t.theaterBg,'22:14'],
    ['06','设置 · 极简（含昼夜切换）',<SettingsScreen t={t} theme={theme} setTheme={setTheme}/>,t.screenBg,'22:16'],
  ];
  return <div className="stage" style={{background:t.stageBg}}>
    <div className="page-head">
      <div className="kicker" style={{color:t.accent,opacity:.9}}>Morning · Prototype 03 · Day / Night</div>
      <h1 style={{color:t.text}}>微光仪式 · 昼夜双主题</h1>
      <p style={{color:t.sub}}>同一套排版，两种配色：<b style={{color:t.accent,fontWeight:600}}>夜</b>是纯黑影院 + 余烬金（方向③），<b style={{color:t.accent,fontWeight:600}}>昼</b>换成暖纸 + 墨红（方向②的配色）。用户可在设置里手动切换，布局、动效、文案完全一致。</p>
    </div>
    <div className="themebar"><ThemeSwitch theme={theme} setTheme={setTheme} t={t}/></div>
    <div className="rack">{screens.map(([n,cap,el,bg,time])=>(
      <div className="cell" key={n}><div className="cap" style={{color:t.sub}}><b style={{color:t.accent}}>{n}</b>{cap}</div><Phone t={t} bg={bg} time={time}>{el}</Phone></div>
    ))}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
