<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morning 原型 · 方向② 纸质信笺</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #DED2B6;
    background-image: radial-gradient(1000px 700px at 50% -5%, #ece2c8, #d8cbac 70%);
    min-height: 100vh;
    font-family: "Noto Serif SC", "EB Garamond", serif;
    color: #2E2A22; padding: 56px 40px 80px;
  }
  .page-head { text-align:center; max-width:900px; margin:0 auto 52px; }
  .page-head .kicker { font-size:13px; letter-spacing:.34em; text-transform:uppercase; color:#B0472F; }
  .page-head h1 { font-family:"EB Garamond","Noto Serif SC",serif; font-weight:500; font-size:40px; margin:12px 0 10px; }
  .page-head p { font-size:15px; line-height:1.8; color:#6b6355; max-width:640px; margin:0 auto; }
  .rack { display:flex; flex-wrap:wrap; gap:40px 30px; justify-content:center; align-items:flex-start; max-width:1500px; margin:0 auto; }
  .cell { display:flex; flex-direction:column; align-items:center; }
  .cell .cap { font-style:italic; font-family:"EB Garamond",serif; font-size:15px; color:#6b6355; margin-bottom:14px; }
  .cell .cap b { color:#B0472F; font-style:normal; font-weight:600; margin-right:6px; }
  @keyframes wave2 { 0%,100%{transform:scaleY(.35)} 50%{transform:scaleY(1)} }
  @keyframes floatIn2 { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
</style>
</head>
<body>
<div class="page-head">
  <div class="kicker">Morning · Prototype 02</div>
  <h1>纸质信笺 · Paper &amp; Ink</h1>
  <p>邮政寄存的隐喻：倾倒是「投进信箱」，托管回执是盖了邮戳的「收件单」，次日归还是「今日投递」，结算物可以是一封不寄出的信。暖纸、墨色、手作的私密感。</p>
</div>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const RUST='#B0472F';
const INK='#2E2A22';
const SUB='#7c7261';
const PAPER='#F4ECD8';
const serif='"EB Garamond","Noto Serif SC",serif';
const song='"Noto Serif SC",serif';
const paperCard={ background:'#FBF6E7', border:'1px solid #DCCFB0', borderRadius:14, boxShadow:'0 1px 0 #fff inset, 0 6px 16px rgba(120,100,60,.1)' };
const screenBg='linear-gradient(180deg,#F6EEDB,#EFE5CE)';
const pad={ padding:'70px 26px 30px' };

/* iOS 外壳 · light mode */
const F={
  wrapper:{display:'inline-block',padding:11,background:'#3a3226',borderRadius:58,boxShadow:'0 0 0 2px #4a4030, 0 30px 60px rgba(80,60,30,.35)'},
  screen:{position:'relative',borderRadius:47,overflow:'hidden'},
  statusBar:{position:'absolute',top:0,left:0,right:0,height:54,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 32px',fontSize:16,fontWeight:600,zIndex:20,pointerEvents:'none'},
  island:{position:'absolute',top:12,left:'50%',transform:'translateX(-50%)',width:120,height:35,background:'#1a1206',borderRadius:999,zIndex:30},
  content:{position:'absolute',top:54,left:0,right:0,bottom:0,overflow:'hidden'},
  home:{position:'absolute',bottom:9,left:'50%',transform:'translateX(-50%)',width:130,height:5,background:'rgba(46,42,34,.35)',borderRadius:999,zIndex:25},
};
function Phone({children,bg,time='23:47'}) {
  return <div style={F.wrapper}><div style={{...F.screen,width:372,height:806,background:bg}}>
    <div style={{...F.statusBar,color:INK}}>
      <span>{time}</span>
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        <div style={{display:'flex',alignItems:'flex-end',gap:2,height:11}}>{[4,6,8,10].map((h,i)=><div key={i} style={{width:3,height:h,background:'currentColor',borderRadius:1}}/>)}</div>
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"/><path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round"/><path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity=".6"/></svg>
        <div style={{width:25,height:12,border:'1.4px solid currentColor',borderRadius:3,padding:1,opacity:.85,position:'relative'}}><div style={{width:'82%',height:'100%',background:'currentColor',borderRadius:1}}/><div style={{position:'absolute',top:3,right:-3,width:2,height:6,background:'currentColor',borderRadius:'0 1px 1px 0'}}/></div>
      </div>
    </div>
    <div style={F.island}/><div style={F.content}>{children}</div><div style={F.home}/>
  </div></div>;
}

/* 邮戳 */
function Stamp({children}) {
  return <div style={{display:'inline-block',border:`2px solid ${RUST}`,color:RUST,borderRadius:6,padding:'4px 9px',fontSize:12,letterSpacing:'.1em',transform:'rotate(-7deg)',fontWeight:600,opacity:.85}}>{children}</div>;
}

/* 屏1 倾倒 */
function DumpScreen(){
  const [on,setOn]=useState(false);
  return <div style={{...pad,height:'100%',display:'flex',flexDirection:'column'}}>
    <div style={{fontSize:13,letterSpacing:'.2em',color:RUST}}>今晚 · 投进信箱</div>
    <h2 style={{fontFamily:serif,fontWeight:500,fontSize:31,lineHeight:1.35,marginTop:16}}>把今晚放不下的，<br/>写进来。</h2>
    <p style={{fontSize:14.5,color:SUB,marginTop:14,lineHeight:1.8}}>{on?'在听着，慢慢说。像给谁写信，不用工整。':'不用有条理。想到什么，说什么或写什么。'}</p>
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:24}}>
      <button onClick={()=>setOn(v=>!v)} style={{width:150,height:118,border:`1.5px solid ${RUST}`,borderRadius:'14px',background: on?'#fff':'#FBF6E7',cursor:'pointer',position:'relative',boxShadow:'0 8px 20px rgba(120,90,40,.15)',display:'grid',placeItems:'center'}}>
        <div style={{position:'absolute',top:0,left:0,right:0,height:'46%',background:RUST,opacity: on?.9:.14,borderRadius:'12px 12px 40% 40%',transition:'.4s'}}/>
        {on
          ? <div style={{display:'flex',alignItems:'center',gap:4,height:30,zIndex:1}}>{[0,1,2,3,4].map(i=><div key={i} style={{width:4,height:26,background:RUST,borderRadius:2,animation:`wave2 .9s ${i*.12}s ease-in-out infinite`}}/>)}</div>
          : <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke={RUST} strokeWidth="1.4" style={{zIndex:1,marginTop:8}}><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 8l9 6 9-6"/></svg>}
      </button>
      <div style={{fontFamily:serif,fontStyle:'italic',fontSize:16,color:SUB}}>{on?'倾倒中…投递到今晚的信箱':'按住，说给它听'}</div>
    </div>
    <div style={{...paperCard,padding:'14px 16px',display:'flex',alignItems:'center',gap:10}}>
      <span style={{color:SUB,fontFamily:serif,fontStyle:'italic'}}>Aa</span>
      <span style={{fontSize:14,color:SUB}}>或者，提笔写下来…</span>
    </div>
  </div>;
}

/* 屏2 回执 */
function ReceiptScreen(){
  const lines=[['2 件','明早投递回你手上'],['1 个灵感','存进灵感抽屉'],['1 件','已经有了下一步'],['2 件','今晚无需处理']];
  return <div style={{...pad,height:'100%',display:'flex',flexDirection:'column'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
      <div><div style={{fontSize:13,letterSpacing:'.2em',color:RUST}}>收件回执</div>
      <h2 style={{fontFamily:serif,fontWeight:500,fontSize:28,marginTop:12}}>妥了，已收件 6 份</h2></div>
      <Stamp>已收件</Stamp>
    </div>
    <div style={{...paperCard,marginTop:20,padding:'4px 18px',position:'relative'}}>
      <div style={{position:'absolute',left:14,right:14,top:0,borderTop:'1px dashed #cbbd9c',height:0}}/>
      {lines.map(([n,t],i)=>(
        <div key={i} style={{display:'flex',alignItems:'baseline',gap:12,padding:'12px 0',borderBottom: i<3?'1px dashed #e2d8bd':'none',animation:`floatIn2 .5s ${i*.1}s both`}}>
          <span style={{fontFamily:serif,fontSize:19,color:RUST,minWidth:52}}>{n}</span>
          <span style={{fontSize:14.5,color:INK}}>{t}</span>
        </div>
      ))}
    </div>
    <div style={{marginTop:14,padding:'12px 15px',border:`1px solid ${RUST}`,borderRadius:12,display:'flex',alignItems:'center',gap:12,background:'rgba(176,71,47,.05)'}}>
      <span style={{fontSize:18}}>⏱</span>
      <div><div style={{fontSize:11,color:RUST,letterSpacing:'.1em'}}>明早 10:00 · 到点投递提醒</div><div style={{fontSize:15,marginTop:2}}>交材料</div></div>
    </div>
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16}}>
      <svg width="66" height="66" viewBox="0 0 48 48" fill="none" stroke={RUST} strokeWidth="1.5"><rect x="7" y="14" width="34" height="26" rx="3"/><path d="M7 14l17 12 17-12"/><circle cx="24" cy="10" r="3" fill={RUST} stroke="none"/></svg>
      <p style={{fontFamily:serif,fontStyle:'italic',fontSize:16.5,color:INK,textAlign:'center',lineHeight:1.7}}>它们都收好了。<br/>你现在不必再记着。</p>
    </div>
    <div style={{textAlign:'center',fontSize:13,color:SUB,letterSpacing:'.1em'}}>↓ 合上，睡吧</div>
  </div>;
}

/* 屏3 归还 */
function ReturnScreen(){
  const [done,setDone]=useState({});
  const items=[['交材料','昨晚你说 10 点前要交',['加入日历','复制到项目']],['给妈打个电话','来自那晚的重演结算',['加入待办','暂缓一天']],['修那个报错','代码里还留着',['加入待办','确认已处理']]];
  return <div style={{...pad,height:'100%',overflow:'auto'}}>
    <div style={{fontSize:13,letterSpacing:'.2em',color:RUST}}>今日投递 · 6:30</div>
    <h2 style={{fontFamily:serif,fontWeight:500,fontSize:25,marginTop:12,lineHeight:1.45}}>昨晚寄存 6 份，<br/>今天为你送回 3 份。</h2>
    <div style={{marginTop:18,display:'flex',flexDirection:'column',gap:12}}>
      {items.map(([t,s,acts],i)=>(
        <div key={i} style={{...paperCard,padding:'14px 16px',position:'relative',opacity:done[i]?.55:1,transition:'.3s'}}>
          <div style={{position:'absolute',top:12,right:14}}>{done[i]?<span style={{color:RUST,fontSize:12}}>✓ 已妥</span>:<span style={{width:8,height:8,borderRadius:'50%',background:RUST,display:'inline-block'}}/>}</div>
          <div style={{fontSize:16,fontWeight:500,textDecoration:done[i]?'line-through':'none'}}>{t}</div>
          <div style={{fontSize:12.5,color:SUB,marginTop:4}}>{s}</div>
          <div style={{display:'flex',gap:8,marginTop:12,flexWrap:'wrap'}}>
            {acts.map(a=><button key={a} onClick={()=>setDone(d=>({...d,[i]:true}))} style={{fontSize:12.5,padding:'7px 13px',borderRadius:8,cursor:'pointer',border:`1px solid ${RUST}`,background:'transparent',color:RUST}}>{a}</button>)}
          </div>
        </div>
      ))}
    </div>
    <div style={{marginTop:20,paddingTop:14,borderTop:'1px dashed #cbbd9c'}}>
      <div style={{fontSize:12.5,color:SUB,marginBottom:8}}>待补区 · 地址不全，暂存（不急，你补）</div>
      {[['“下班前”回复客户','缺具体时间'],['寄给老陈的地址','缺地址']].map(([t,s],i)=>(
        <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'9px 0'}}>
          <div><div style={{fontSize:14}}>{t}</div><div style={{fontSize:11.5,color:RUST}}>{s}</div></div>
          <button style={{fontSize:12.5,padding:'6px 12px',borderRadius:8,border:'1px solid #cbbd9c',background:'transparent',color:INK,cursor:'pointer'}}>补全</button>
        </div>
      ))}
    </div>
  </div>;
}

/* 屏4 角色库 */
function CastScreen(){
  const people=[['妈妈','家人 · 12 段往来','M',false],['老陈','前同事 · 没寄出的告别','C',false],['那个夏天的自己','过去的自己 · 特殊收件人','我',true]];
  return <div style={{...pad,height:'100%',overflow:'auto'}}>
    <div style={{fontSize:13,letterSpacing:'.2em',color:RUST}}>收件人 · 建角</div>
    <h2 style={{fontFamily:serif,fontWeight:500,fontSize:27,marginTop:12}}>还没写完的人</h2>
    <p style={{fontSize:13.5,color:SUB,marginTop:8,lineHeight:1.7}}>写下他们的性格、经历、和你的关系。写得越准，越是在看清你自己。</p>
    <div style={{marginTop:18,display:'flex',flexDirection:'column',gap:12}}>
      {people.map(([n,r,ini,sp],i)=>(
        <div key={i} style={{...paperCard,padding:'14px',display:'flex',alignItems:'center',gap:14,borderColor:sp?RUST:'#DCCFB0'}}>
          <div style={{width:48,height:48,borderRadius:8,border:`1.5px solid ${sp?RUST:'#cbbd9c'}`,display:'grid',placeItems:'center',fontFamily:serif,fontSize:18,color:sp?RUST:SUB,flexShrink:0,background: sp?'rgba(176,71,47,.06)':'transparent'}}>{ini}</div>
          <div style={{flex:1}}><div style={{fontSize:16}}>{n}</div><div style={{fontSize:12.5,color:sp?RUST:SUB,marginTop:3}}>{r}</div></div>
          <span style={{color:SUB,fontSize:20}}>›</span>
        </div>
      ))}
    </div>
    <button style={{marginTop:16,width:'100%',padding:'15px',borderRadius:12,border:`1px dashed ${RUST}`,background:'transparent',color:RUST,fontSize:14.5,cursor:'pointer',fontFamily:serif}}>+ 写下一个收件人</button>
  </div>;
}

/* 屏5 剧场 */
function TheaterScreen(){
  const [step,setStep]=useState(0);
  const next=()=>setStep(s=>Math.min(s+1,2));
  return <div style={{height:'100%',display:'flex',flexDirection:'column',background:'linear-gradient(180deg,#F1E7CF,#E8DCC0)'}}>
    <div style={{padding:'66px 24px 0'}}>
      <div style={{display:'flex',gap:6,marginBottom:16}}>{['校准','重演','结算'].map((l,i)=>(
        <div key={i} style={{flex:1,textAlign:'center'}}><div style={{height:3,borderRadius:2,background:i<=step?RUST:'#d3c7a8'}}/><div style={{fontSize:11,marginTop:6,color:i<=step?RUST:SUB}}>{l}</div></div>
      ))}</div>
    </div>
    <div style={{flex:1,padding:'6px 24px',overflow:'auto'}}>
      {step===0 && (<>
        <div style={{fontFamily:serif,fontSize:20,marginBottom:6}}>那晚 · 客厅</div>
        <p style={{fontSize:13,color:SUB,marginBottom:18,lineHeight:1.7}}>先教它演对。不对就改——每次纠正，都是你在看清心里那个她。</p>
        <div style={{...paperCard,padding:'13px 15px',marginBottom:12}}><div style={{fontSize:11,color:RUST,marginBottom:5}}>妈妈</div><div style={{fontSize:14.5,lineHeight:1.7,fontFamily:song}}>“你怎么又这么晚，跟你说过多少次了。”</div></div>
        <button onClick={next} style={{width:'100%',padding:'13px',borderRadius:10,border:`1px solid ${RUST}`,background:'rgba(176,71,47,.06)',color:RUST,fontSize:14,cursor:'pointer'}}>不对，她不会这么说 →</button>
        <p style={{fontSize:12.5,color:SUB,marginTop:14,fontStyle:'italic',fontFamily:serif,lineHeight:1.7}}>她嘴上凶，但那天她其实先给你留了灯、热了饭。</p>
      </>)}
      {step===1 && (<>
        <div style={{fontFamily:serif,fontSize:20,marginBottom:12}}>重演 · 那个雨夜</div>
        <div style={{height:168,borderRadius:12,background:'linear-gradient(160deg,#d8c9a4,#c2ad82)',position:'relative',overflow:'hidden',marginBottom:14,border:'1px solid #cbbd9c'}}>
          <div style={{position:'absolute',inset:0,background:'radial-gradient(circle at 68% 34%,rgba(176,71,47,.2),transparent 60%)'}}/>
          <div style={{position:'absolute',bottom:0,left:'50%',transform:'translateX(-50%)',width:64,height:112,background:'linear-gradient(180deg,rgba(120,90,40,.5),rgba(120,90,40,.15))',borderRadius:'36px 36px 0 0'}}/>
          <div style={{position:'absolute',top:12,left:14,fontSize:11,color:'rgba(46,42,34,.6)',letterSpacing:'.08em'}}>命中「客厅」模板 · 风格化立绘</div>
        </div>
        <div style={{...paperCard,padding:'13px 15px',marginBottom:12}}><div style={{fontSize:11,color:RUST,marginBottom:5}}>妈妈</div><div style={{fontSize:14.5,lineHeight:1.7,fontFamily:song}}>“……饭在锅里，还热着。快去洗手。”</div></div>
        <button onClick={next} style={{width:'100%',padding:'13px',borderRadius:10,border:'none',background:RUST,color:'#fff',fontSize:14,cursor:'pointer'}}>我有话想对她说 →</button>
      </>)}
      {step===2 && (<>
        <div style={{fontFamily:serif,fontSize:20,marginBottom:6}}>结算 · 一封不寄出的信</div>
        <p style={{fontSize:13,color:SUB,marginBottom:16,lineHeight:1.7}}>带一件东西回来，这场才不是空聊。</p>
        <div style={{...paperCard,padding:'18px 16px',marginBottom:12,borderColor:RUST}}>
          <div style={{fontSize:11,color:RUST,letterSpacing:'.1em',marginBottom:10}}>致 妈妈 · 不必寄出</div>
          <div style={{fontFamily:serif,fontSize:16.5,lineHeight:1.8,fontStyle:'italic'}}>“妈，那天谢谢你留的那盏灯。<br/>我一直记得。”</div>
        </div>
        {['写成一封不寄出的信','一句终于说出口的话','明天能做的一个最小行动'].map((o,i)=>(
          <div key={i} style={{padding:'11px 0',fontSize:14,color:i===0?INK:SUB,display:'flex',gap:10}}><span style={{color:RUST}}>{i===0?'●':'○'}</span>{o}</div>
        ))}
        <button style={{marginTop:14,width:'100%',padding:'14px',borderRadius:10,border:'none',background:RUST,color:'#fff',fontSize:14,cursor:'pointer'}}>把「给妈打个电话」放进明早投递 ↩</button>
      </>)}
    </div>
  </div>;
}

/* 屏6 设置 */
function Toggle({on:init=false}){const [on,setOn]=useState(init);return <button onClick={()=>setOn(v=>!v)} style={{width:46,height:27,borderRadius:999,border:'none',cursor:'pointer',background:on?RUST:'#cbbd9c',position:'relative',transition:'.25s',flexShrink:0}}><span style={{position:'absolute',top:3,left:on?22:3,width:21,height:21,borderRadius:'50%',background:'#FBF6E7',transition:'.25s'}}/></button>;}
function SettingsScreen(){
  const groups=[['隐私 · 你的信只属于你',[['保留原始录音','关掉后只留整理好的收件单',false],['仅在本机识别','敏感内容不出设备',true],['阅后即焚','看过的历史自动销毁',true]]],['提醒',[['到点主动投递','带时间的事，agent 到点提醒',true],['睡前轻唤','每晚 21:30，一次轻提醒',true]]]];
  return <div style={{...pad,height:'100%',overflow:'auto'}}>
    <div style={{fontSize:13,letterSpacing:'.2em',color:RUST}}>设置</div>
    <h2 style={{fontFamily:serif,fontWeight:500,fontSize:27,marginTop:12}}>越少越好</h2>
    {groups.map(([title,rows],gi)=>(
      <div key={gi} style={{marginTop:22}}>
        <div style={{fontSize:12,color:SUB,letterSpacing:'.04em',marginBottom:10}}>{title}</div>
        <div style={{...paperCard,overflow:'hidden',padding:0}}>
          {rows.map(([t,s,on],ri)=>(
            <div key={ri} style={{display:'flex',alignItems:'center',gap:12,padding:'14px 16px',borderTop:ri?'1px dashed #e2d8bd':'none'}}>
              <div style={{flex:1}}><div style={{fontSize:14.5}}>{t}</div><div style={{fontSize:12,color:SUB,marginTop:2}}>{s}</div></div><Toggle on={on}/>
            </div>
          ))}
        </div>
      </div>
    ))}
    <p style={{fontSize:12.5,color:SUB,textAlign:'center',marginTop:26,lineHeight:1.8,fontStyle:'italic',fontFamily:serif}}>Morning 从不承诺治疗，<br/>只帮你的大脑，安心下班。</p>
  </div>;
}

const screens=[
  ['01','倾倒入口 · 睡前最后一屏',<DumpScreen/>,screenBg,'23:47'],
  ['02','托管回执「妥了」',<ReceiptScreen/>,screenBg,'23:49'],
  ['03','次日归还「明早见」',<ReturnScreen/>,screenBg,'6:30'],
  ['04','角色库 · 建角',<CastScreen/>,screenBg,'22:10'],
  ['05','剧场「那晚」· 校准→重演→结算',<TheaterScreen/>,'#F1E7CF','22:14'],
  ['06','设置 · 极简',<SettingsScreen/>,screenBg,'22:16'],
];
function App(){return <div className="rack">{screens.map(([n,cap,el,bg,time])=>(
  <div className="cell" key={n}><div className="cap"><b>{n}</b>{cap}</div><Phone bg={bg} time={time}>{el}</Phone></div>
))}</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
