<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morning 原型 · 方向③ 微光仪式</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #070606;
    background-image: radial-gradient(1100px 800px at 50% -8%, #1c1512, #0a0807 62%, #050403);
    min-height: 100vh;
    font-family: "Noto Serif SC", "Cormorant Garamond", serif;
    color: #EDE6DA; padding: 56px 40px 90px;
  }
  .page-head { text-align:center; max-width:900px; margin:0 auto 54px; }
  .page-head .kicker { font-size:13px; letter-spacing:.4em; text-transform:uppercase; color:#F0A868; opacity:.9; }
  .page-head h1 { font-family:"Cormorant Garamond","Noto Serif SC",serif; font-weight:500; font-size:44px; margin:14px 0 12px; letter-spacing:.02em; }
  .page-head p { font-size:15px; line-height:1.85; color:#9a8f80; max-width:660px; margin:0 auto; }
  .rack { display:flex; flex-wrap:wrap; gap:44px 32px; justify-content:center; align-items:flex-start; max-width:1500px; margin:0 auto; }
  .cell { display:flex; flex-direction:column; align-items:center; }
  .cell .cap { font-style:italic; font-family:"Cormorant Garamond",serif; font-size:15px; color:#8f8474; margin-bottom:16px; letter-spacing:.02em; }
  .cell .cap b { color:#F0A868; font-style:normal; font-weight:600; margin-right:7px; }
  @keyframes wave3 { 0%,100%{transform:scaleY(.3);opacity:.5} 50%{transform:scaleY(1);opacity:1} }
  @keyframes floatIn3 { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  @keyframes breathe3 { 0%,100%{opacity:.5;transform:scale(1)} 50%{opacity:.95;transform:scale(1.06)} }
  @keyframes flare { 0%,100%{opacity:.7} 50%{opacity:1} }
</style>
</head>
<body>
<div class="page-head">
  <div class="kicker">Morning · Prototype 03</div>
  <h1>微光仪式 · Ritual Glow</h1>
  <p>纯黑的影院感。一束暖光打在保管箱上，卡片是逐渐熄灭的余烬 —— 交出去，就暗下来。仪式感、克制、只留一处发光的焦点，像深夜里唯一亮着的那盏灯。</p>
</div>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const EMBER='#F0A868';
const EMBER2='#E8894B';
const TEXT='#EDE6DA';
const SUB='#8f8474';
const FAINT='#5f574c';
const serif='"Cormorant Garamond","Noto Serif SC",serif';
const song='"Noto Serif SC",serif';
const card={ background:'rgba(255,255,255,.035)', border:'1px solid rgba(240,168,104,.14)', borderRadius:16, backdropFilter:'blur(2px)' };
const screenBg='radial-gradient(120% 80% at 50% 0%, #171310, #0b0908 65%, #070605)';
const pad={ padding:'72px 26px 32px' };

/* iOS 外壳 · dark cinematic */
const F={
  wrapper:{display:'inline-block',padding:11,background:'#161210',borderRadius:58,boxShadow:'0 0 0 1.5px #2a231d, 0 30px 70px rgba(0,0,0,.7), 0 0 60px rgba(240,168,104,.06)'},
  screen:{position:'relative',borderRadius:47,overflow:'hidden'},
  statusBar:{position:'absolute',top:0,left:0,right:0,height:54,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 32px',fontSize:16,fontWeight:500,zIndex:20,pointerEvents:'none'},
  island:{position:'absolute',top:12,left:'50%',transform:'translateX(-50%)',width:120,height:35,background:'#000',borderRadius:999,zIndex:30},
  content:{position:'absolute',top:54,left:0,right:0,bottom:0,overflow:'hidden'},
  home:{position:'absolute',bottom:9,left:'50%',transform:'translateX(-50%)',width:130,height:5,background:'rgba(237,230,218,.4)',borderRadius:999,zIndex:25},
};
function Phone({children,bg,time='23:47'}) {
  return <div style={F.wrapper}><div style={{...F.screen,width:372,height:806,background:bg}}>
    <div style={{...F.statusBar,color:TEXT}}>
      <span>{time}</span>
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        <div style={{display:'flex',alignItems:'flex-end',gap:2,height:11}}>{[4,6,8,10].map((h,i)=><div key={i} style={{width:3,height:h,background:'currentColor',borderRadius:1}}/>)}</div>
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"/><path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round"/><path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity=".6"/></svg>
        <div style={{width:25,height:12,border:'1.4px solid currentColor',borderRadius:3,padding:1,opacity:.85,position:'relative'}}><div style={{width:'82%',height:'100%',background:'currentColor',borderRadius:1}}/><div style={{position:'absolute',top:3,right:-3,width:2,height:6,background:'currentColor',borderRadius:'0 1px 1px 0'}}/></div>
      </div>
    </div>
    <div style={F.island}/><div style={F.content}>{children}</div><div style={F.home}/>
  </div></div>;
}

/* 屏1 倾倒 */
function DumpScreen(){
  const [on,setOn]=useState(false);
  return <div style={{...pad,height:'100%',display:'flex',flexDirection:'column',position:'relative'}}>
    <div style={{position:'absolute',top:0,left:0,right:0,height:'100%',background:`radial-gradient(60% 34% at 50% 62%, rgba(240,168,104,${on?.16:.08}), transparent 70%)`,pointerEvents:'none',transition:'1s'}}/>
    <div style={{fontSize:12.5,letterSpacing:'.28em',color:EMBER,zIndex:1}}>今夜 · 最后一件事</div>
    <h2 style={{fontFamily:serif,fontWeight:500,fontSize:33,lineHeight:1.32,marginTop:16,zIndex:1}}>说给夜听。<br/>其余的，交出去。</h2>
    <p style={{fontSize:14.5,color:SUB,marginTop:14,lineHeight:1.85,zIndex:1}}>{on?'在听。慢慢说，不用有条理。':'今晚放不下的，一件件说出来。'}</p>
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:30,zIndex:1}}>
      <button onClick={()=>setOn(v=>!v)} style={{width:132,height:132,borderRadius:'50%',border:'none',cursor:'pointer',background:`radial-gradient(circle at 50% 42%, ${EMBER}, ${EMBER2} 62%, #7a4322)`,boxShadow: on?`0 0 60px rgba(240,168,104,.6),0 0 120px rgba(240,168,104,.3)`:`0 0 34px rgba(240,168,104,.28)`,position:'relative',transition:'.5s',animation: on?'none':'breathe3 3.4s ease-in-out infinite',display:'grid',placeItems:'center'}}>
        {on
          ? <div style={{display:'flex',alignItems:'center',gap:4,height:34}}>{[0,1,2,3,4].map(i=><div key={i} style={{width:4,height:30,background:'#2a1608',borderRadius:2,animation:`wave3 1s ${i*.13}s ease-in-out infinite`}}/>)}</div>
          : <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2a1608" strokeWidth="1.8"><path d="M12 2a3 3 0 013 3v6a3 3 0 01-6 0V5a3 3 0 013-3z"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>}
      </button>
      <div style={{fontFamily:serif,fontStyle:'italic',fontSize:17,color: on?EMBER:SUB,transition:'.4s'}}>{on?'倾倒中…':'按住，开始'}</div>
    </div>
    <div style={{...card,padding:'14px 16px',display:'flex',alignItems:'center',gap:10,zIndex:1}}>
      <span style={{color:FAINT,fontFamily:serif,fontStyle:'italic',fontSize:15}}>Aa</span>
      <span style={{fontSize:14,color:FAINT}}>或者，安静地打字…</span>
    </div>
  </div>;
}

/* 屏2 回执 — hero：一束光打在保管箱 */
function ReceiptScreen(){
  const embers=[['2 件','明早交还给你'],['1 个灵感','已封存'],['1 件','已生成下一步'],['2 件','无需再想']];
  return <div style={{height:'100%',display:'flex',flexDirection:'column',position:'relative',background:'radial-gradient(80% 46% at 50% 30%, rgba(240,168,104,.14), transparent 66%)'}}>
    <div style={{...pad,paddingBottom:0}}>
      <div style={{fontSize:12.5,letterSpacing:'.28em',color:EMBER,textAlign:'center'}}>妥了</div>
      <h2 style={{fontFamily:serif,fontWeight:500,fontSize:27,marginTop:10,textAlign:'center'}}>6 件，都收进保管箱了</h2>
    </div>
    {/* 保管箱：唯一的光源焦点 */}
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',position:'relative'}}>
      <div style={{position:'absolute',top:'6%',left:'50%',transform:'translateX(-50%)',width:2,height:'42%',background:`linear-gradient(180deg, rgba(240,168,104,.5), transparent)`}}/>
      <div style={{position:'relative',animation:'flare 4s ease-in-out infinite'}}>
        <div style={{position:'absolute',inset:-46,borderRadius:'50%',background:'radial-gradient(circle, rgba(240,168,104,.35), transparent 70%)'}}/>
        <svg width="112" height="112" viewBox="0 0 48 48" fill="none" stroke={EMBER} strokeWidth="1.4" style={{position:'relative'}}>
          <rect x="8" y="16" width="32" height="24" rx="3"/>
          <path d="M8 24h32" opacity=".6"/>
          <rect x="20" y="20" width="8" height="7" rx="1.5" fill={EMBER} stroke="none" opacity=".9"/>
          <path d="M14 16l4-6h12l4 6" opacity=".7"/>
        </svg>
      </div>
      <div style={{marginTop:22,display:'flex',flexDirection:'column',gap:9,width:250}}>
        {embers.map(([n,t],i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:11,animation:`floatIn3 .6s ${.2+i*.12}s both`,opacity:i>1?.5:1}}>
            <span style={{width:7,height:7,borderRadius:'50%',background:EMBER,boxShadow:i>1?'none':`0 0 8px ${EMBER}`,opacity:i>1?.4:1,flexShrink:0}}/>
            <span style={{fontFamily:serif,fontSize:16,color:EMBER,minWidth:46}}>{n}</span>
            <span style={{fontSize:13.5,color:SUB}}>{t}</span>
          </div>
        ))}
      </div>
    </div>
    <div style={{padding:'0 26px 26px',textAlign:'center'}}>
      <p style={{fontFamily:serif,fontStyle:'italic',fontSize:16.5,color:TEXT,lineHeight:1.75,marginBottom:14}}>灯我替你留着。<br/>你可以关机了。</p>
      <div style={{fontSize:12.5,color:FAINT,letterSpacing:'.14em'}}>↓ 熄灯 · 睡吧</div>
    </div>
  </div>;
}

/* 屏3 归还 */
function ReturnScreen(){
  const [done,setDone]=useState({});
  const items=[['交材料','昨晚你说 10 点前要交',['加入日历','复制到项目']],['给妈打个电话','来自那晚的重演结算',['加入待办','暂缓一天']],['修那个报错','代码里还留着',['加入待办','确认已处理']]];
  return <div style={{...pad,height:'100%',overflow:'auto'}}>
    <div style={{fontSize:12.5,letterSpacing:'.28em',color:EMBER}}>明早见 · 6:30</div>
    <h2 style={{fontFamily:serif,fontWeight:500,fontSize:25,marginTop:12,lineHeight:1.45}}>昨晚收了 6 件，<br/>只把该做的 3 件交还你。</h2>
    <div style={{marginTop:18,display:'flex',flexDirection:'column',gap:12}}>
      {items.map(([t,s,acts],i)=>(
        <div key={i} style={{...card,padding:'15px 16px',position:'relative',opacity:done[i]?.4:1,transition:'.4s',borderColor:done[i]?'rgba(255,255,255,.06)':'rgba(240,168,104,.14)'}}>
          <div style={{position:'absolute',top:15,right:15}}>{done[i]?<span style={{color:FAINT,fontSize:12}}>✓ 已熄</span>:<span style={{width:8,height:8,borderRadius:'50%',background:EMBER,boxShadow:`0 0 8px ${EMBER}`,display:'inline-block'}}/>}</div>
          <div style={{fontSize:16,fontWeight:500,textDecoration:done[i]?'line-through':'none',color:done[i]?SUB:TEXT}}>{t}</div>
          <div style={{fontSize:12.5,color:SUB,marginTop:4}}>{s}</div>
          <div style={{display:'flex',gap:8,marginTop:13,flexWrap:'wrap'}}>
            {acts.map(a=><button key={a} onClick={()=>setDone(d=>({...d,[i]:true}))} style={{fontSize:12.5,padding:'7px 13px',borderRadius:9,cursor:'pointer',border:`1px solid rgba(240,168,104,.35)`,background:'rgba(240,168,104,.06)',color:EMBER}}>{a}</button>)}
          </div>
        </div>
      ))}
    </div>
    <div style={{marginTop:20,paddingTop:15,borderTop:'1px solid rgba(255,255,255,.06)'}}>
      <div style={{fontSize:12.5,color:SUB,marginBottom:8}}>待补区 · 缺信息，先替你留着（不急）</div>
      {[['“下班前”回复客户','缺具体时间'],['寄给老陈的地址','缺地址']].map(([t,s],i)=>(
        <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'9px 0'}}>
          <div><div style={{fontSize:14}}>{t}</div><div style={{fontSize:11.5,color:EMBER,opacity:.85}}>{s}</div></div>
          <button style={{fontSize:12.5,padding:'6px 12px',borderRadius:9,border:'1px solid rgba(255,255,255,.14)',background:'transparent',color:SUB,cursor:'pointer'}}>补全</button>
        </div>
      ))}
    </div>
  </div>;
}

/* 屏4 角色库 */
function CastScreen(){
  const people=[['妈妈','家人 · 12 段记忆','妈',false],['老陈','旧同事 · 未完成的告别','陈',false],['那个夏天的自己','过去的自己 · 特殊角色','我',true]];
  return <div style={{...pad,height:'100%',overflow:'auto'}}>
    <div style={{fontSize:12.5,letterSpacing:'.28em',color:EMBER}}>角色库 · 建角</div>
    <h2 style={{fontFamily:serif,fontWeight:500,fontSize:27,marginTop:12}}>你生命里的人</h2>
    <p style={{fontSize:13.5,color:SUB,marginTop:8,lineHeight:1.75}}>写下他的性格、经历、和你的关系史。写得越准，重演时他就越像那个真实的他。</p>
    <div style={{marginTop:18,display:'flex',flexDirection:'column',gap:12}}>
      {people.map(([n,r,ini,sp],i)=>(
        <div key={i} style={{...card,padding:'15px',display:'flex',alignItems:'center',gap:14,borderColor:sp?'rgba(240,168,104,.4)':'rgba(240,168,104,.14)',background:sp?'rgba(240,168,104,.06)':'rgba(255,255,255,.035)'}}>
          <div style={{width:48,height:48,borderRadius:'50%',display:'grid',placeItems:'center',fontFamily:song,fontSize:16,color: sp?'#2a1608':TEXT,flexShrink:0,background: sp?`radial-gradient(circle at 40% 35%, ${EMBER}, ${EMBER2})`:'rgba(255,255,255,.06)',border:sp?'none':'1px solid rgba(240,168,104,.2)',boxShadow:sp?`0 0 18px rgba(240,168,104,.4)`:'none'}}>{ini}</div>
          <div style={{flex:1}}><div style={{fontSize:16}}>{n}</div><div style={{fontSize:12.5,color:sp?EMBER:SUB,marginTop:3}}>{r}</div></div>
          <span style={{color:FAINT,fontSize:20}}>›</span>
        </div>
      ))}
    </div>
    <button style={{marginTop:16,width:'100%',padding:'15px',borderRadius:12,border:'1px dashed rgba(240,168,104,.4)',background:'transparent',color:EMBER,fontSize:14.5,cursor:'pointer',fontFamily:serif}}>+ 写下一个人</button>
  </div>;
}

/* 屏5 剧场 */
function TheaterScreen(){
  const [step,setStep]=useState(1);
  const next=()=>setStep(s=>Math.min(s+1,2));
  return <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#050403'}}>
    <div style={{padding:'66px 24px 0'}}>
      <div style={{display:'flex',gap:6,marginBottom:14}}>{['校准','重演','结算'].map((l,i)=>(
        <div key={i} style={{flex:1,textAlign:'center'}}><div style={{height:2.5,borderRadius:2,background:i<=step?EMBER:'rgba(255,255,255,.1)',boxShadow:i<=step?`0 0 6px ${EMBER}`:'none'}}/><div style={{fontSize:11,marginTop:6,color:i<=step?EMBER:FAINT}}>{l}</div></div>
      ))}</div>
    </div>
    <div style={{flex:1,padding:'6px 24px',overflow:'auto'}}>
      {step===0 && (<>
        <div style={{fontFamily:serif,fontSize:20,marginBottom:6}}>校准 · 她会怎么说</div>
        <p style={{fontSize:13,color:SUB,marginBottom:18,lineHeight:1.7}}>不对就改。每一次纠正，都是你在看清心里那个她。</p>
        <div style={{...card,padding:'14px 15px',marginBottom:12}}><div style={{fontSize:11,color:EMBER,marginBottom:5}}>妈妈</div><div style={{fontSize:14.5,lineHeight:1.7,fontFamily:song}}>“你怎么又这么晚，说过多少次了。”</div></div>
        <button onClick={next} style={{width:'100%',padding:'13px',borderRadius:10,border:'1px solid rgba(240,168,104,.4)',background:'rgba(240,168,104,.06)',color:EMBER,fontSize:14,cursor:'pointer'}}>不对，她不会这么说 →</button>
      </>)}
      {step===1 && (<>
        <div style={{fontFamily:serif,fontSize:20,marginBottom:12}}>重演 · 那个雨夜</div>
        <div style={{height:184,borderRadius:14,background:'radial-gradient(circle at 62% 40%, rgba(240,168,104,.22), #0a0706 70%)',position:'relative',overflow:'hidden',marginBottom:14,border:'1px solid rgba(240,168,104,.12)'}}>
          <div style={{position:'absolute',bottom:0,left:'50%',transform:'translateX(-50%)',width:56,height:120,background:'linear-gradient(180deg, rgba(240,168,104,.4), rgba(240,168,104,.04))',borderRadius:'30px 30px 0 0',filter:'blur(1px)'}}/>
          <div style={{position:'absolute',bottom:24,left:'50%',transform:'translateX(-50%)',width:22,height:22,borderRadius:'50%',background:EMBER,boxShadow:`0 0 20px ${EMBER}`,opacity:.5}}/>
          <div style={{position:'absolute',top:12,left:14,fontSize:10.5,color:'rgba(240,168,104,.7)',letterSpacing:'.1em'}}>◆ 命中「客厅」· three.js 3D 重演</div>
        </div>
        <div style={{...card,padding:'14px 15px',marginBottom:12}}><div style={{fontSize:11,color:EMBER,marginBottom:5}}>妈妈</div><div style={{fontSize:14.5,lineHeight:1.7,fontFamily:song}}>“……饭在锅里，还热着。快去洗手吧。”</div></div>
        <button onClick={next} style={{width:'100%',padding:'13px',borderRadius:10,border:'none',background:`linear-gradient(90deg,${EMBER},${EMBER2})`,color:'#2a1608',fontSize:14,fontWeight:600,cursor:'pointer'}}>我有话想对她说 →</button>
      </>)}
      {step===2 && (<>
        <div style={{fontFamily:serif,fontSize:20,marginBottom:6}}>结算 · 带一件东西回来</div>
        <p style={{fontSize:13,color:SUB,marginBottom:16,lineHeight:1.7}}>不必修好过去，只留一句能带回当下的话。</p>
        <div style={{...card,padding:'18px 16px',marginBottom:14,borderColor:'rgba(240,168,104,.4)',background:'rgba(240,168,104,.05)'}}>
          <div style={{fontSize:11,color:EMBER,letterSpacing:'.12em',marginBottom:10}}>一句终于说出口的话</div>
          <div style={{fontFamily:serif,fontSize:17,lineHeight:1.8,fontStyle:'italic'}}>“妈，那天谢谢你留的那盏灯。<br/>我一直记得。”</div>
        </div>
        {['一句终于说出口的话','一封不寄出的信','明天能做的一个最小行动'].map((o,i)=>(
          <div key={i} style={{padding:'11px 0',fontSize:14,color:i===0?TEXT:SUB,display:'flex',gap:10}}><span style={{color:EMBER}}>{i===0?'●':'○'}</span>{o}</div>
        ))}
        <button style={{marginTop:14,width:'100%',padding:'14px',borderRadius:10,border:'none',background:`linear-gradient(90deg,${EMBER},${EMBER2})`,color:'#2a1608',fontSize:14,fontWeight:600,cursor:'pointer'}}>把「给妈打个电话」放进明早 ↩</button>
      </>)}
    </div>
  </div>;
}

/* 屏6 设置 */
function Toggle({on:init=false}){const [on,setOn]=useState(init);return <button onClick={()=>setOn(v=>!v)} style={{width:46,height:27,borderRadius:999,border:'none',cursor:'pointer',background:on?EMBER:'rgba(255,255,255,.14)',position:'relative',transition:'.25s',flexShrink:0,boxShadow:on?`0 0 12px rgba(240,168,104,.5)`:'none'}}><span style={{position:'absolute',top:3,left:on?22:3,width:21,height:21,borderRadius:'50%',background:on?'#2a1608':'#EDE6DA',transition:'.25s'}}/></button>;}
function SettingsScreen(){
  const groups=[['隐私 · 你说的只属于你',[['保留原始倾诉','关掉后只留整理结果，原话即焚',false],['仅在本机识别','敏感内容不出设备',true],['阅后即焚','看过的历史自动熄灭',true]]],['提醒',[['到点主动提醒','带时间的事，agent 到点唤你',true],['睡前轻唤','每晚 22:00，一次轻提醒',true]]]];
  return <div style={{...pad,height:'100%',overflow:'auto'}}>
    <div style={{fontSize:12.5,letterSpacing:'.28em',color:EMBER}}>设置</div>
    <h2 style={{fontFamily:serif,fontWeight:500,fontSize:27,marginTop:12}}>只留一处光</h2>
    {groups.map(([title,rows],gi)=>(
      <div key={gi} style={{marginTop:22}}>
        <div style={{fontSize:12,color:SUB,letterSpacing:'.04em',marginBottom:10}}>{title}</div>
        <div style={{...card,overflow:'hidden',padding:0}}>
          {rows.map(([t,s,on],ri)=>(
            <div key={ri} style={{display:'flex',alignItems:'center',gap:12,padding:'15px 16px',borderTop:ri?'1px solid rgba(255,255,255,.06)':'none'}}>
              <div style={{flex:1}}><div style={{fontSize:14.5}}>{t}</div><div style={{fontSize:12,color:SUB,marginTop:2}}>{s}</div></div><Toggle on={on}/>
            </div>
          ))}
        </div>
      </div>
    ))}
    <p style={{fontSize:12.5,color:FAINT,textAlign:'center',marginTop:26,lineHeight:1.85,fontStyle:'italic',fontFamily:serif}}>Morning 从不承诺治疗，<br/>只帮你的大脑，安心下班。</p>
  </div>;
}

const screens=[
  ['01','倾倒入口 · 睡前最后一屏',<DumpScreen/>,screenBg,'23:47'],
  ['02','托管回执「妥了」· 一束光',<ReceiptScreen/>,screenBg,'23:49'],
  ['03','次日归还「明早见」',<ReturnScreen/>,screenBg,'6:30'],
  ['04','角色库 · 建角',<CastScreen/>,screenBg,'22:10'],
  ['05','剧场「那晚」· 校准→重演→结算',<TheaterScreen/>,'#050403','22:14'],
  ['06','设置 · 极简',<SettingsScreen/>,screenBg,'22:16'],
];
function App(){return <div className="rack">{screens.map(([n,cap,el,bg,time])=>(
  <div className="cell" key={n}><div className="cap"><b>{n}</b>{cap}</div><Phone bg={bg} time={time}>{el}</Phone></div>
))}</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
