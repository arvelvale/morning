<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>那晚 · Morning 重演剧场</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; }
    #app { width: 100%; height: 100%; }
    canvas { display: block; }

    #ui {
      position: fixed; left: 0; right: 0; bottom: 24px;
      display: flex; justify-content: center; gap: 8px;
      pointer-events: none; z-index: 10;
    }
    #ui button {
      pointer-events: auto;
      padding: 8px 16px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: rgba(10, 12, 20, 0.55);
      color: rgba(235, 238, 245, 0.65);
      font-size: 13px; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }
    #ui button:hover { color: #fff; border-color: rgba(255,255,255,0.35); }
    #ui button.active {
      color: #ffe9c4;
      border-color: rgba(255, 220, 160, 0.5);
      background: rgba(60, 45, 25, 0.45);
    }

    #title {
      position: fixed; top: 28px; left: 32px; z-index: 10;
      color: rgba(235, 238, 245, 0.8);
      font-family: "PingFang SC", "Microsoft YaHei", serif;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    #title h1 { font-size: 18px; font-weight: 500; letter-spacing: 4px; }
    #title p { margin-top: 6px; font-size: 12px; color: rgba(235,238,245,0.4); letter-spacing: 2px; }

    #fader {
      position: fixed; inset: 0; background: #05060a;
      opacity: 0; pointer-events: none;
      transition: opacity 0.45s ease; z-index: 20;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="title">
    <h1>那晚</h1>
    <p id="scene-sub"></p>
  </div>
  <div id="ui"></div>
  <div id="fader"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
