[project]
name = "morning-backend"
version = "0.2.0"
description = "Morning 后端 — AI 网关 + 双轴记忆系统（LangGraph 编排）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13.0",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "pillow>=10.0",
    "jieba>=0.42.1",
]

[tool.uv]
package = false
