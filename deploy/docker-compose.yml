# Morning 后端线上编排。服务器上的布局：
#   /opt/morning/docker-compose.yml   ← 本文件
#   /opt/morning/backend/             ← 后端源码（deploy/deploy.py 同步上传）
#   /opt/morning/.env                 ← 线上密钥（不入库，deploy.py 生成）
#
# 起停：cd /opt/morning && docker compose up -d --build / docker compose down
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: morning-backend:latest
    container_name: morning-backend
    restart: unless-stopped
    env_file:
      - .env
    # DATABASE_URL 只从 .env 读取，避免宿主机同名变量误覆盖线上库。
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - morning-data:/data
      - morning-static:/app/static
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    profiles: ["pg"]
    image: postgres:16
    container_name: morning-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: morning
      POSTGRES_DB: morning
      POSTGRES_PASSWORD: ${MORNING_PG_PASSWORD:-}
    volumes:
      - morning-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morning -d morning"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # 改名继承：沿用 mindoff 时代的存量卷名，避免用户数据迁移
  morning-data:
    name: mindoff_mindoff-data
  morning-static:
    name: mindoff_mindoff-static
  morning-postgres-data:
    name: morning-postgres-data
